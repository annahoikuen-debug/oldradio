# Fly.io configuration
# Streamlit was removed: the image starts with
#   uvicorn retro_radio.server:app --host 0.0.0.0 --port 8501
# NOTE: this is TOML, so entries are `key = "value"` (NOT `key: value`).

app = "retro-radio"
primary_region = "nrt"

# スキーマ変更は migration で適用する。
# Base.metadata.create_all() は既存テーブルの定義（外部キー制約・インデックス）を更新しない。
#
# release_command is intentionally NOT used.
# Fly runs release_command on a temporary Machine and does NOT mount
# persistent volumes there
# (https://fly.io/docs/volumes/overview/ -> "When volumes are not available").
# So `alembic upgrade head` would write to a throwaway ephemeral FS and the
# result is discarded. Migrations are run at process start instead (see
# [processes].app below), which runs on a Machine that HAS the volume.
#
# A release_command is only meaningful when the DB is a network service
# (e.g. PostgreSQL). With SQLite on a local volume it is a no-op at best.

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8501"
  # List 型（cors_origins）は pydantic-settings が JSON として解析する。
  # カンマ区切りや単独の * は起動時に SettingsError になる。
  RETRO_RADIO_CORS_ORIGINS = "[\"https://retro-radio.fly.dev\"]"
  RETRO_RADIO_APP_URL = "https://retro-radio.fly.dev"
  RETRO_RADIO_DEBUG = "false"

  # Gemini (AI原稿生成) - 未設定でも起動するが /health が degraded になる
  # API key はここでは宣言しない（上記参照。`fly secrets set` を使う）。
  RETRO_RADIO_GEMINI_MODEL = "gemini-3.5-flash-lite"

  # Premium TTS (ElevenLabs) - 未設定なら gTTS にフォールバック
  # API key はここでは宣言しない（上記参照）。

  # Secret keys are NOT declared here. Declaring SECRET_KEY (or the API keys)
  # as "" overrides whatever `fly secrets set` stored, and with
  # require_auth=true an empty SECRET_KEY means "no credentials configured"
  # -> 503 unavailable on every protected API. Set them from the CLI:
  #   fly secrets set RETRO_RADIO_SECRET_KEY="$(python -c 'import secrets;print(secrets.token_urlsafe(48))')"
  #   fly secrets set RETRO_RADIO_GEMINI_API_KEY=...
  #   fly secrets set RETRO_RADIO_ELEVENLABS_API_KEY=...

  # Auth mode is declared explicitly (never rely on the code default).
  # true = facility mode: browser login + session cookie via
  # POST /api/auth/session (docs/privacy_and_tenancy.md, "facility use").
  # false = personal mode, no auth. Never use it on a public PaaS.
  RETRO_RADIO_REQUIRE_AUTH = "true"

  # DB: SQLite on the persistent volume mounted at /data.
  # Never declare this as "": pydantic-settings accepts the empty string as an
  # override and does NOT fall back to the config.py default
  # `sqlite:///./retro_radio.db`, so db/session.py calls create_engine("")
  # and both startup and `alembic upgrade head` fail on every deploy.
  # Four slashes = absolute path (sqlite:////data/... is /data/...).
  RETRO_RADIO_DATABASE_URL = "sqlite:////data/retro_radio.db"
  # The song store is a separate SQLite file; keep it on the same volume
  # (by default it is placed next to the database file).
  RETRO_RADIO_SONG_STORE_PATH = "/data/retro_radio_song_store.db"

  RETRO_RADIO_CACHE_TTL = "3600"
  RETRO_RADIO_MAX_RETRIES = "3"
  RETRO_RADIO_RETRY_MULTIPLIER = "2"
  RETRO_RADIO_ITUNES_LIMIT = "50"
  RETRO_RADIO_TTS_LANGUAGE = "ja"
  RETRO_RADIO_TTS_SLOW = "false"
  RETRO_RADIO_TTS_TLD = "co.jp"
  RETRO_RADIO_TTS_CACHE_TTL_DAYS = "7"
  RETRO_RADIO_TTS_CACHE_SWEEP_INTERVAL = "50"
  RETRO_RADIO_DEFAULT_YEAR = "1975"
  RETRO_RADIO_MIN_YEAR = "1950"
  RETRO_RADIO_MAX_YEAR = "2025"
  RETRO_RADIO_MEDLEY_SONG_COUNT = "3"
  RETRO_RADIO_TARGET_SCRIPT_CHARS = "1000"
  RETRO_RADIO_SCRIPT_CHAR_TOLERANCE = "200"
  RETRO_RADIO_MAX_CONCURRENT_GENERATIONS = "2"
  RETRO_RADIO_GENERATION_WAIT_TIMEOUT = "30"

[http_service]
  internal_port = 8501
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [http_service.concurrency]
    type = "requests"
    soft_limit = 200
    hard_limit = 250

  # /health returns JSON. `/?health=check` only returned the SPA HTML
  # and was therefore not a real health check - it has been removed.
  [[http_service.checks]]
    grace_period = "60s"
    interval = "30s"
    method = "GET"
    timeout = "10s"
    path = "/health"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 512

# ---------------------------------------------------------------------------
# Persistent storage
# ---------------------------------------------------------------------------
# Without a volume the container filesystem is ephemeral: the SQLite database,
# the song store and the TTS cache are lost on every machine restart and on
# every redeploy. A Fly volume can only be attached to one Machine at a time,
# so a single app must run exactly one Machine (see min_machines_running above
# and `processes = ["app"]`).
#
# Create it once, before the first deploy:
#   fly volumes create retro_radio_data --size 1 --region nrt
[[mounts]]
  source = "retro_radio_data"
  destination = "/data"

# The TTS audio cache (server.py: CACHE_DIR = tempfile.gettempdir() /
# "retro_radio_audio_cache", i.e. /tmp/retro_radio_audio_cache) is left
# ephemeral on purpose: a Fly Machine can mount only ONE volume, and the audio
# cache is pure derived data that is regenerated by gTTS/ElevenLabs on demand.
# Losing it costs latency, not data. The Dockerfile declares
# VOLUME ["/data", "/tmp/retro_radio_audio_cache"] so `docker run` without
# -v does not silently write into the container layer.
[processes]
  # alembic runs here (not in release_command) so that it operates on the
  # mounted volume. `&&` keeps the deploy honest: if the migration fails the
  # app does not start serving traffic against an outdated schema.
  app = "sh -c 'alembic upgrade head && exec uvicorn retro_radio.server:app --host 0.0.0.0 --port 8501'"
