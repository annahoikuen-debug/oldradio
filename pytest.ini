[pytest]
# retro_radio/tests/ は tests/ へ統合済み（統合判断は docs/ を参照）。
# 実行時のみ有効な統合テスト含め、CI と ローカルで同じ対象を走らせる。
testpaths = tests

python_files = test_*.py
python_classes = Test*
python_functions = test_*

asyncio_mode = auto
asyncio_default_fixture_loop_scope = function

# 既定で外部ネットワークを使うテストは除外する（-m network で明示的に実行）。
addopts =
    --strict-markers
    --strict-config
    -m "not network"

markers =
    network: 実ネットワーク（iTunes / gTTS / Gemini / ElevenLabs）を叩くテスト。既定は skip される
    slow: 実行に時間がかかるテスト

filterwarnings =
    ignore::DeprecationWarning
    ignore::UserWarning
    # 設定が未充足でも起動は妨げない（A2/A5 方針）ため、secret_key 警告は CI を止めない
    ignore:.*RETRO_RADIO_SECRET_KEY.*:RuntimeWarning
