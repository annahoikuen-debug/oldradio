name: Security Scan
on:
  schedule: [{ cron: '0 0 * * 0' }]  # every Sunday
  push: { branches: [main] }
  pull_request: { branches: [main] }

# Least privilege per job. Workflow-level default is read-only; the jobs that
# genuinely need more say so explicitly.
permissions:
  contents: read

jobs:
  dependabot-config:
    # Verifies that .github/dependabot.yml exists and parses. Kept as its own
    # always-on job: the automation below only runs for Dependabot PRs, so
    # folding this check into it would mean `push` / `schedule` never validated
    # the config the `dependabot` job's premise rests on.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Verify dependabot config exists
        run: |
          test -f .github/dependabot.yml || {
            echo "::error::.github/dependabot.yml is missing"; exit 1; }
          python -c "import yaml,sys; yaml.safe_load(open('.github/dependabot.yml'))"

  dependabot:
    # ONLY for Dependabot-authored pull requests.
    #
    # `dependabot/fetch-metadata` requires a `pull_request` event and errors on
    # anything else, and `gh pr merge` needs `github.event.pull_request.number`
    # — yet this job used to run on `push` and `schedule` too, so it failed on
    # every push to main. A workflow that is red on every push trains people to
    # ignore red, which is exactly when it matters.
    #
    # `permissions` here is a full override of the workflow-level read-only
    # block: `gh pr merge` needs `contents: write` (the previous job had only
    # `pull-requests: write`, so the merge itself was under-privileged too).
    if: github.event_name == 'pull_request' && github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: dependabot/fetch-metadata@08eff52bf64351f401fb50d4972fa95b9f2c2d1b # v2.4.0
        id: metadata
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # Matches the step's own promise ("patch and minor"): the condition used
      # to be only `github.actor == 'dependabot[bot]'`, so SEMVER-MAJOR
      # dependency updates were auto-merged without review as well.
      - name: Auto-merge patch and minor dependabot PRs
        if: >-
          steps.metadata.outputs.update-type == 'version-update:semver-patch' ||
          steps.metadata.outputs.update-type == 'version-update:semver-minor'
        # `--auto` defers the merge until required status checks pass, so this
        # is only safe with branch protection + required checks on main. Without
        # them it merges immediately — see the "Enabling automerge" note in
        # https://docs.github.com/en/code-security/dependabot/working-with-dependabot/automating-dependabot-with-github-actions
        run: gh pr merge --auto --squash "$PR_NUMBER"
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  pip-audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - run: pip install pip-audit
      - name: Audit dependencies
        run: |
          # PYSEC-2026-2132 (click) is knowingly unresolved: gTTS 2.5.4 pins
          # click<8.2, so no click >= 8.3.3 resolves. The reasoning and the
          # measurements live at the bottom of requirements.txt; keep this
          # ignore id in sync with that note, and drop it once gTTS is replaced.
          pip-audit -r requirements.txt -r requirements-dev.txt \
            --ignore-vuln PYSEC-2026-2132 \
            --format=json --output audit.json
      # pip-audit emits its own JSON schema, NOT SARIF. Uploading it through
      # upload-sarif produced a "not a valid SARIF file" parse error and hid
      # the real findings, so the report goes to the job summary + an artifact
      # instead.
      - name: Publish findings to the job summary
        if: always()
        run: |
          python - <<'PY'
          import json, os
          path = "audit.json"
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as out:
              out.write("## pip-audit\n\n")
              if not os.path.exists(path):
                  out.write("pip-audit produced no report.\n")
                  raise SystemExit(0)
              data = json.load(open(path, encoding="utf-8"))
              deps = data.get("dependencies", [])
              vulns = [v for d in deps for v in d.get("vulns", [])]
              if not vulns:
                  out.write("No known vulnerabilities.\n")
              for v in vulns:
                  out.write(
                      f"- **{v.get('name')}** {v.get('version')}: "
                      f"{v.get('id')} - {(v.get('fix_versions') or ['no fix'])[0]}\n"
                  )
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: pip-audit-report
          path: audit.json
          if-no-files-found: warn

  codeql:
    # v2 is retired; v3.28.17 (pinned by commit SHA) is current.
    #
    # `init` / `analyze` are STEP-level actions. They used to be declared as
    # job-level `uses:`, which only accepts a reusable workflow
    # (`./file.yml`, `owner/repo/file.yml@ref`, `docker://…`), so the job never
    # validated and CodeQL produced no results at all. Keep them under
    # `steps:`.
    #
    # `languages` belongs to `init` only — `analyze` has no such input (it
    # inherits the language from `init`), so passing it there just produced an
    # "Unexpected input" warning.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write  # required to upload the SARIF results
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: github/codeql-action/init@60168efe1c415ce0f5521ea06d5c2062adbeed1b # v3.28.17
        with:
          languages: python

      - uses: github/codeql-action/analyze@60168efe1c415ce0f5521ea06d5c2062adbeed1b # v3.28.17
        with:
          category: "/language:python"
