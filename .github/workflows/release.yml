name: Release
on:
  push:
    tags: ['v*']

permissions:
  contents: read

# This project is NOT a distributed package: there is no pyproject.toml, no
# setup.py and no LICENSE (see README.md). Publishing to PyPI was therefore
# impossible and always skipped, because the publish step was gated on a
# placeholder repository owner ("your-org").
#
# What a tag release actually means here: build the container image, push it
# to GHCR, and create a GitHub Release with the generated notes. There is no
# `python -m build` and no `twine upload`, and no changelog generator (git-cliff
# was never installed, so that step failed on every run).
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write  # push the image to GHCR
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Lint (same commands as CI)
        run: |
          pip install -r requirements.txt -r requirements-dev.txt
          flake8 tests
          flake8 --config .github/flake8-app-baseline.ini retro_radio
      - uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0
      - uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push the image
        uses: docker/build-push-action@471d1dc4e07e5cdedd4c2171150001c434f0b7a4 # v6.15.0
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.ref_name }}
            ghcr.io/${{ github.repository }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write  # create the GitHub Release
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: { fetch-depth: 0 }
      - name: Create GitHub Release
        uses: softprops/action-gh-release@c95fe1489396fe8a9eb87c0abf8aa5b2ef267fda # v2.2.1
        with:
          generate_release_notes: true
          body: |
            Container image: `ghcr.io/${{ github.repository }}:${{ github.ref_name }}`
          # No dist/*: there is no sdist/wheel to attach.
      - name: Record the deployment note
        run: |
          echo "Released ${{ github.ref_name }}."
          echo "Deploy with: fly deploy / render deploy / railway up"
