name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: [ "3.11", "3.12", "3.13" ]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    # TestClient に httpx が必要。requirements-dev.txt には入っているので、
    # 「pip install pytest pytest-cov flake8」だけだと TestClient 系が全滅する。
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt -r requirements-dev.txt

    # テストはプロジェクト標準（.flake8）のまま厳しい。
    # CLI で --max-line-length / --extend-ignore を渡さないこと（.flake8 と二重定義になるため）。
    - name: Lint tests
      run: flake8 tests

    # アプリコードには Wave 1 以前の既存違反が残っている（テスト担当の外）。
    # 既存の違反だけを列挙した設定で緩める。新規の違反は必ず落ちる。
    - name: Lint app (with Wave 1 baseline)
      run: |
        flake8 --config .github/flake8-app-baseline.ini retro_radio

    # pytest.ini の testpaths / addopts（-m "not network"）が効くので、
    # 引数で対象を上書きしない。RETRO_RADIO_GEMINI_API_KEY は意図的に設定しない
    # （キー未設定時のフォールバック経路をテストするため）。
    - name: Run tests
      run: python -m pytest --cov=retro_radio --cov-report=xml --cov-report=term

    - name: Verify migrations are in sync
      if: matrix.python-version == '3.13'
      run: |
        pip install alembic
        alembic upgrade head
        alembic check

    - name: Upload coverage to Codecov (optional)
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false

