[flake8]
# retro_radio/** 用の lint 設定。
#
# `.flake8`（ベース設定）をそのまま使うと、Wave 1 以前から残っている既存の
# 整形Entropy erva弾 で lint が落ちる。アプリコードはテスト担当（A7）の管轄外のため、
# **既存の違反だけを列挙して緩める**ことにした。「新たに増える違反」は必ず CI で落ちる。
#
# 使い方（.github/workflows/ci.yml）:
#   flake8 --config .github/flake8-app-baseline.ini \
#           --extend-exclude=retro_radio/utils/logging_config.py retro_radio
#
# 注意: extend-ignore の値にインラインコメント（# ...）を書くと
# `ValueError: Error code '#' ...` でflake8 が起動しなくなる。
#       コードの列挙と説明は分離すること。
#
# 除外している既存違反:
#   E203/W503/E501/E225/E231/E251/E261/E262/E265/E302/E305/E402/W291/W293
#       ... .flake8 と共通（black / ruff-format 互換。整形と行長は ruff の責務）
#   F401 ... 未使用 import（core/music_search.py, core/tts.py, services/export_service.py など）
#   W292 ... ファイル末尾に改行がない
#   W391 ... ファイル末尾が空行
#   E301 ... 関数定義前の空行数
#   E701 ... 1行中のステートメント区切り（utils/errors.py の dict リテラル内）
#   E131 ... 継続行のインデント（db/repository.py）
#   E502 ... 括弧内の冗長なバックスラッシュ（db/repository.py）
#
# アプリ側で違反が解消したら、ここから1つずつコードを削除すること。

max-line-length = 100

extend-ignore =
    E203,
    W503,
    E501,
    E225,
    E231,
    E251,
    E261,
    E262,
    E265,
    E302,
    E305,
    E402,
    W291,
    W293,
    F401,
    W292,
    W391,
    E301,
    E701,
    E131,
    E502

exclude =
    .git,
    __pycache__,
    .venv,
    venv,
    env,
    build,
    dist,
    .mypy_cache,
    .pytest_cache,
    .ruff_cache,
    .hypothesis
