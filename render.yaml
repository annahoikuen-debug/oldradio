# Render blueprint (https://render.com/docs/blueprint-spec)
services:
  - type: web
    name: retro-radio
    runtime: docker
    dockerfilePath: ./Dockerfile
    # Persistent disks are NOT available on the free plan, and a Render free
    # web service also spins down and loses its filesystem on every deploy.
    # `starter` is the cheapest plan that supports `disk:` below.
    plan: starter
    # Streamlit removed; startup is uvicorn only.
    # Migrations run here (NOT in preDeployCommand) so they execute on an
    # instance that has the persistent disk attached. A failed migration stops
    # the service instead of leaving it serving an outdated schema.
    startCommand: >-
      sh -c 'alembic upgrade head &&
      exec uvicorn retro_radio.server:app --host 0.0.0.0 --port $PORT'
    # Database, song store and (optionally) the TTS cache live on the disk.
    # Without this, /data is container-local and everything is lost on redeploy.
    disk:
      name: retro-radio-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: PORT
        sync: false
      - key: RETRO_RADIO_GEMINI_API_KEY
        sync: false
      - key: RETRO_RADIO_ELEVENLABS_API_KEY
        sync: false
      - key: RETRO_RADIO_SECRET_KEY
        generateValue: true
      # Auth mode is declared explicitly. `true` = facility mode: browser
      # login + session cookie issued by POST /api/auth/session
      # (docs/privacy_and_tenancy.md). Leaving this unset made the app fall
      # back to the code default (true) *without* a working login path, so
      # /api/generate answered 401 forever. `false` (personal mode, no auth)
      # must never be used on a public Render deployment.
      - key: RETRO_RADIO_REQUIRE_AUTH
        value: "true"
      # SQLite on the persistent disk. Never set this to "" (Render would
      # happily pass the empty string through and db/session.py would call
      # create_engine("")).
      - key: RETRO_RADIO_DATABASE_URL
        value: "sqlite:////data/retro_radio.db"
      - key: RETRO_RADIO_SONG_STORE_PATH
        value: "/data/retro_radio_song_store.db"
      - key: RETRO_RADIO_APP_URL
        sync: false
      - key: RETRO_RADIO_CORS_ORIGINS
        # List type is parsed as JSON by pydantic-settings (comma separated
        # values raise SettingsError at startup).
        value: '["https://retro-radio.onrender.com"]'
      - key: RETRO_RADIO_DEBUG
        value: "false"
      - key: RETRO_RADIO_CACHE_TTL
        value: "3600"
      - key: RETRO_RADIO_MAX_RETRIES
        value: "3"
      - key: RETRO_RADIO_RETRY_MULTIPLIER
        value: "2"
      - key: RETRO_RADIO_ITUNES_LIMIT
        value: "50"
      - key: RETRO_RADIO_GEMINI_MODEL
        value: "gemini-3.5-flash-lite"
      - key: RETRO_RADIO_TTS_LANGUAGE
        value: "ja"
      - key: RETRO_RADIO_TTS_SLOW
        value: "false"
      - key: RETRO_RADIO_TTS_TLD
        value: "co.jp"
      - key: RETRO_RADIO_DEFAULT_YEAR
        value: "1975"
      - key: RETRO_RADIO_MIN_YEAR
        value: "1950"
      - key: RETRO_RADIO_MAX_YEAR
        value: "2025"
      - key: RETRO_RADIO_MEDLEY_SONG_COUNT
        value: "3"
      - key: RETRO_RADIO_TARGET_SCRIPT_CHARS
        value: "1000"
      - key: RETRO_RADIO_SCRIPT_CHAR_TOLERANCE
        value: "200"
      - key: RETRO_RADIO_MAX_CONCURRENT_GENERATIONS
        value: "2"
      - key: RETRO_RADIO_GENERATION_WAIT_TIMEOUT
        value: "30"
    # /health is a real API endpoint returning JSON (/ serves the SPA HTML, so
    # it is not usable as a health check).
    healthCheckPath: /health
    autoDeploy: true
